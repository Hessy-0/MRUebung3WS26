<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hello, World! • A-Frame</title>
    <meta name="description" content="Hello, World! • A-Frame">
    <script src="../../../dist/aframe-master.js"></script>
  </head>
  <body>
    <a-scene background="color: #ECECEC">
      <a-assets>
        <a-asset-item id="tree" src="../../assets/models/tree1.glb"></a-asset-item>
        <img id="crateTexture" src="../../assets/models/crate/crate.jpg">
      </a-assets>

      <a-box position="-1 0.5 -3" rotation="0 45 0" src="#crateTexture" shadow></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E" shadow></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D" shadow></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4" shadow></a-plane>
      <a-gltf-model src="#tree" position="2 0 -4" scale="1.4 1.4 1.4" shadow></a-gltf-model>

      <a-light type="directional" light="castShadow: true" position="-1 4 2" intensity="1.5"
               shadow-camera-automatic="[shadow]"></a-light>
    </a-scene>
  </body>
</html>
